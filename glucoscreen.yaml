  - id: goto_tile
    parameters:
      idx: int
    then:
      # idx = aktuelle Seite +1 (weiter) bzw. -1 (zurück).
      # Die neue Seite wird immer direkt neben die aktuelle gelegt und beide
      # gleiten gemeinsam – dadurch funktioniert auch der Sprung
      # letzte -> erste Seite (und umgekehrt) mit Animation.
      - lambda: |-
          const int NP = 4;
          lv_obj_t *pg[NP] = {id(page_main), id(page_chart), id(page_limits), id(page_display)};
          const int SW = 480;
          int from = id(cur_tile);
          int dir = idx > from ? 1 : -1;           // +1: neue Seite kommt von rechts
          int to = ((idx % NP) + NP) % NP;
          if (to == from) return;
          id(cur_tile) = to;

          auto anim_del = [](lv_obj_t *o) {
          #if LVGL_VERSION_MAJOR >= 9
            lv_anim_delete(o, nullptr);
          #else
            lv_anim_del(o, nullptr);
          #endif
          };
          auto slide = [](lv_obj_t *o, int32_t a, int32_t b) {
            lv_anim_t an;
            lv_anim_init(&an);
            lv_anim_set_var(&an, o);
            lv_anim_set_values(&an, a, b);
          #if LVGL_VERSION_MAJOR >= 9
            lv_anim_set_duration(&an, 280);
          #else
            lv_anim_set_time(&an, 280);
          #endif
            lv_anim_set_exec_cb(&an, [](void *var, int32_t v) { lv_obj_set_x((lv_obj_t *) var, v); });
            lv_anim_set_path_cb(&an, lv_anim_path_ease_out);
            lv_anim_start(&an);
          };

          for (int i = 0; i < NP; i++) anim_del(pg[i]);
          lv_obj_update_layout(id(pages));
          // Startpositionen (auch wenn eine vorherige Animation noch lief)
          int32_t from_x = lv_obj_get_x(pg[from]);
          int32_t to_x = lv_obj_get_x(pg[to]);
          if (to_x * dir <= 0 || abs(to_x) >= SW) to_x = dir * SW;
          for (int i = 0; i < NP; i++)
            if (i != from && i != to) lv_obj_set_x(pg[i], SW);   // übrige Seiten außerhalb parken
          lv_obj_set_x(pg[to], to_x);
          slide(pg[from], from_x, -dir * SW);
          slide(pg[to], to_x, 0);
      - script.execute: update_page_dots

  # ---------- Diagramm ----------
  - id: set_range
    parameters:
      h: int
    then:
      - lambda: "id(chart_hours) = h;"
      - lvgl.widget.update:
          id: btn_3h
          state:
            checked: !lambda "return h == 3;"
      - lvgl.widget.update:
          id: btn_6h
          state:
            checked: !lambda "return h == 6;"
      - lvgl.widget.update:
          id: btn_12h
          state:
            checked: !lambda "return h == 12;"
      - lvgl.widget.update:
          id: btn_24h
          state:
            checked: !lambda "return h == 24;"
