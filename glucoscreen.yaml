  - id: chart_redraw
    then:
      - lambda: |-
          if (!id(ui_ready)) return;
          const ui::Palette &P = ui::pal(id(dark_active));
          // Geometrie muss zu chart_area im LVGL-Teil passen
          const int W = 390, H = 320, AX = 14, AY = 74;
          static lv_obj_t *dots[288] = {nullptr};
          static lv_obj_t *xlbl[6], *xtick[6];
          lv_obj_t *area = id(chart_area);
          lv_obj_t *card = lv_obj_get_parent(area);

          if (dots[0] == nullptr) {
            for (int i = 0; i < 288; i++) {
              lv_obj_t *d = lv_obj_create(area);
              lv_obj_remove_style_all(d);
              lv_obj_clear_flag(d, LV_OBJ_FLAG_CLICKABLE);
              lv_obj_clear_flag(d, LV_OBJ_FLAG_SCROLLABLE);
              lv_obj_set_style_bg_opa(d, LV_OPA_COVER, 0);
              lv_obj_set_style_radius(d, LV_RADIUS_CIRCLE, 0);
              lv_obj_add_flag(d, LV_OBJ_FLAG_HIDDEN);
              dots[i] = d;
            }
            for (int i = 0; i < 6; i++) {
              xlbl[i] = lv_label_create(card);
              lv_obj_set_style_text_font(xlbl[i], &lv_font_montserrat_20, 0);
              lv_obj_set_style_text_align(xlbl[i], LV_TEXT_ALIGN_CENTER, 0);
              lv_obj_set_width(xlbl[i], 70);
              lv_obj_add_flag(xlbl[i], LV_OBJ_FLAG_HIDDEN);
              xtick[i] = lv_obj_create(card);
              lv_obj_remove_style_all(xtick[i]);
              lv_obj_set_style_bg_opa(xtick[i], LV_OPA_COVER, 0);
              lv_obj_set_size(xtick[i], 2, 8);
              lv_obj_add_flag(xtick[i], LV_OBJ_FLAG_HIDDEN);
            }
            // Markierung + Uhrzeit-Anzeige über den Punkten
            lv_obj_move_foreground(id(chart_mark));
            lv_obj_move_foreground(id(chart_tip));
          }

          auto ymap = [&](float v) -> int {
            if (v < 40) v = 40;
            if (v > 400) v = 400;
            return (int) lroundf(H - (v - 40.0f) * H / 360.0f);
          };
          int hi = (int) id(thr_high).state;
          int lo = (int) id(thr_low).state;
          int tlo = (int) id(thr_target_low).state;
          int thi = (int) id(thr_target_high).state;

          // Zielbereich + Grenzlinien
          int y1 = ymap(thi), y2 = ymap(tlo);
          lv_obj_set_pos(id(target_box), 0, y1);
          lv_obj_set_size(id(target_box), W, std::max(1, y2 - y1));
          lv_obj_set_y(id(line_high), ymap(hi) - 1);
          lv_obj_set_y(id(line_low), ymap(lo) - 1);

          // Warnfläche wie in der App, abhängig vom aktuellen Wert
          {
            float g = id(glucose).state;
            uint32_t ts = id(last_reading_ts);
            auto n = id(ha_time).now();
            bool stale = isnan(g) || g <= 0 ||
                (n.is_valid() && ts > 0 && (uint32_t) n.timestamp > ts + 900);
            bool is_high = !stale && g > hi;
            bool is_low = !stale && g < lo;
            uint32_t low_col = (!stale && g < id(thr_urgent_low).state) ? ui::COL_URGENT_LOW : ui::COL_LOW;
            lv_obj_set_size(id(zone_high), W, std::max(1, ymap(hi)));
            lv_obj_set_pos(id(zone_high), 0, 0);
            lv_obj_set_pos(id(zone_low), 0, ymap(lo));
            lv_obj_set_size(id(zone_low), W, std::max(1, H - ymap(lo)));
            lv_obj_set_style_bg_color(id(zone_low), lv_color_hex(low_col), 0);
            if (is_high) lv_obj_clear_flag(id(zone_high), LV_OBJ_FLAG_HIDDEN);
            else lv_obj_add_flag(id(zone_high), LV_OBJ_FLAG_HIDDEN);
            if (is_low) lv_obj_clear_flag(id(zone_low), LV_OBJ_FLAG_HIDDEN);
            else lv_obj_add_flag(id(zone_low), LV_OBJ_FLAG_HIDDEN);
          }

          lv_obj_set_y(id(lbl_y_high), AY + ymap(hi) - 12);
          lv_obj_set_y(id(lbl_y_low), AY + ymap(lo) - 12);
          lv_label_set_text_fmt(id(lbl_y_high), "%d", hi);
          lv_label_set_text_fmt(id(lbl_y_low), "%d", lo);
          if (ymap(hi) < 24) lv_obj_add_flag(id(lbl_y_400), LV_OBJ_FLAG_HIDDEN);
          else lv_obj_clear_flag(id(lbl_y_400), LV_OBJ_FLAG_HIDDEN);
          if (H - ymap(lo) < 24) lv_obj_add_flag(id(lbl_y_40), LV_OBJ_FLAG_HIDDEN);
          else lv_obj_clear_flag(id(lbl_y_40), LV_OBJ_FLAG_HIDDEN);

          auto now = id(ha_time).now();
          if (!now.is_valid()) return;
          uint32_t now_ts = now.timestamp;
          int hours = id(chart_hours);
          uint32_t span = hours * 3600;
          int N = hours * 12;
          int dsz = hours <= 3 ? 10 : hours <= 6 ? 8 : hours <= 12 ? 6 : 4;
          uint32_t now_slot = now_ts / 300;
          uint32_t last = id(hist_last_slot);
          bool newest_done = false;
          int shown = 0;

          for (int i = 0; i < 288; i++) {
            lv_obj_t *d = dots[i];
            uint32_t s = now_slot - i;   // i = 0 -> neuester Slot
            uint16_t raw = 0;
            if (i < N && last != 0 && s <= last && last - s < 288) raw = id(hist_vals)[s % 288];
            int v = raw & 0x0FFF;
            uint32_t t = s * 300 + (raw >> 12) * 20;
            int32_t dt = (int32_t) now_ts - (int32_t) t;
            if (dt < 0) dt = 0;
            int x = W - (int) ((int64_t) dt * W / span);
            if (v == 0 || x < 0) { lv_obj_add_flag(d, LV_OBJ_FLAG_HIDDEN); continue; }
            int sz = dsz;
            if (!newest_done && i <= 3) {
              // aktueller Wert als hohler Kreis (wie in der App)
              sz = dsz + 6;
              lv_obj_set_style_bg_color(d, lv_color_hex(P.card), 0);
              lv_obj_set_style_border_color(d, lv_color_hex(P.dot), 0);
              lv_obj_set_style_border_width(d, 3, 0);
            } else {
              lv_obj_set_style_bg_color(d, lv_color_hex(P.dot), 0);
              lv_obj_set_style_border_width(d, 0, 0);
            }
            newest_done = true;
            lv_obj_set_size(d, sz, sz);
            lv_obj_set_pos(d, x - sz / 2, ymap(v) - sz / 2);
            lv_obj_clear_flag(d, LV_OBJ_FLAG_HIDDEN);
            shown++;
          }
          if (shown == 0) lv_obj_clear_flag(id(lbl_nodata), LV_OBJ_FLAG_HIDDEN);
          else lv_obj_add_flag(id(lbl_nodata), LV_OBJ_FLAG_HIDDEN);

          // Zeitachse in Ortszeit
          int32_t loc = now.hour * 3600 + now.minute * 60 + now.second;
          int32_t off = loc - (int32_t) (now_ts % 86400);
          if (off > 50400) off -= 86400;
          if (off < -43200) off += 86400;
          id(tz_off) = off;
          int64_t now_local = (int64_t) now_ts + off;
          int step = hours <= 3 ? 3600 : hours <= 6 ? 7200 : hours <= 12 ? 10800 : 21600;
          int64_t t = (now_local / step) * step;
          int k = 0;
          for (; k < 6 && t > now_local - (int64_t) span; t -= step) {
            int x = W - (int) ((now_local - t) * W / span);
            if (x < 22) continue;
            int hh = (int) ((t / 3600) % 24), mm = (int) ((t / 60) % 60);
            lv_label_set_text_fmt(xlbl[k], "%02d:%02d", hh, mm);
            lv_obj_set_style_text_color(xlbl[k], lv_color_hex(P.text2), 0);
            lv_obj_set_style_bg_color(xtick[k], lv_color_hex(P.text2), 0);
            lv_obj_set_pos(xlbl[k], AX + x - 35, AY + H + 16);
            lv_obj_set_pos(xtick[k], AX + x - 1, AY + H + 4);
            lv_obj_clear_flag(xlbl[k], LV_OBJ_FLAG_HIDDEN);
            lv_obj_clear_flag(xtick[k], LV_OBJ_FLAG_HIDDEN);
            k++;
          }
          for (; k < 6; k++) {
            lv_obj_add_flag(xlbl[k], LV_OBJ_FLAG_HIDDEN);
            lv_obj_add_flag(xtick[k], LV_OBJ_FLAG_HIDDEN);
          }

  # Punkt unter dem Finger suchen und dessen Uhrzeit (+ Wert) anzeigen
  - id: chart_scrub
    parameters:
      px: int        # Fingerposition relativ zur Diagrammfläche
    then:
      - lambda: |-
          if (!id(ui_ready)) return;
          const int W = 390, H = 320, AX = 14, AY = 74, CW = 464;
          auto now = id(ha_time).now();
          if (!now.is_valid()) return;
          uint32_t now_ts = now.timestamp;
          int hours = id(chart_hours);
          uint32_t span = hours * 3600;
          int N = hours * 12;
          uint32_t now_slot = now_ts / 300;
          uint32_t last = id(hist_last_slot);

          int best_d = 100000, bx = 0, bv = 0;
          uint32_t bt = 0;
          for (int i = 0; i < N; i++) {
            uint32_t s = now_slot - i;
            if (last == 0 || s > last || last - s >= 288) continue;
            uint16_t raw = id(hist_vals)[s % 288];
            int v = raw & 0x0FFF;
            if (v == 0) continue;
            uint32_t t = s * 300 + (raw >> 12) * 20;
            int32_t dt = (int32_t) now_ts - (int32_t) t;
            if (dt < 0) dt = 0;
            int x = W - (int) ((int64_t) dt * W / span);
            if (x < 0) continue;
            int d = abs(x - px);
            if (d < best_d) { best_d = d; bx = x; bv = v; bt = t; }
          }
          if (best_d == 100000) { id(chart_scrub_end)->execute(); return; }

          float vc = bv < 40 ? 40 : (bv > 400 ? 400 : bv);
          int by = (int) lroundf(H - (vc - 40.0f) * H / 360.0f);
          lv_obj_set_x(id(chart_cursor), bx - 1);
          lv_obj_clear_flag(id(chart_cursor), LV_OBJ_FLAG_HIDDEN);
          lv_obj_set_pos(id(chart_mark), bx - 9, by - 9);
          lv_obj_clear_flag(id(chart_mark), LV_OBJ_FLAG_HIDDEN);

          int64_t lt = (int64_t) bt + id(tz_off);
          int hh = (int) ((lt / 3600) % 24), mm = (int) ((lt / 60) % 60);
          lv_label_set_text_fmt(id(chart_tip_lbl), "%02d:%02d  ·  %d", hh, mm, bv);
          lv_obj_clear_flag(id(chart_tip), LV_OBJ_FLAG_HIDDEN);
          lv_obj_update_layout(id(chart_tip));
          int tw = lv_obj_get_width(id(chart_tip));
          int th = lv_obj_get_height(id(chart_tip));
          int tx = AX + bx - tw / 2;
          if (tx < 6) tx = 6;
          if (tx > CW - 6 - tw) tx = CW - 6 - tw;
          int ty = AY + by - th - 16;
          if (ty < 4) ty = AY + by + 16;
          lv_obj_set_pos(id(chart_tip), tx, ty);

  - id: chart_scrub_end
    then:
      - lambda: |-
          if (!id(ui_ready)) return;
          lv_obj_add_flag(id(chart_tip), LV_OBJ_FLAG_HIDDEN);
          lv_obj_add_flag(id(chart_mark), LV_OBJ_FLAG_HIDDEN);
          lv_obj_add_flag(id(chart_cursor), LV_OBJ_FLAG_HIDDEN);

  # ---------- Helligkeit ----------
  - id: dim_compute
    then:
      - lambda: |-
          auto t = id(ha_time).now();
          if (!t.is_valid()) return;
          int cur = t.hour * 60 + t.minute;
          int a = id(night_start).hour * 60 + id(night_start).minute;
          int b = id(night_end).hour * 60 + id(night_end).minute;
          id(night_now) = (a <= b) ? (cur >= a && cur < b) : (cur >= a || cur < b);

  # alle 30 s: nur bei Wechsel Tag <-> Nacht eingreifen,
  # damit manuelle Helligkeitsänderungen aus HA erhalten bleiben
  - id: dim_check
    then:
      - script.execute: dim_compute
      - script.execute: theme_check
      - if:
          condition:
            lambda: "return (int) id(night_now) != id(night_applied);"
          then:
            - script.execute: dim_apply

  - id: dim_apply
    then:
      - script.execute: dim_compute
      - lambda: "id(night_applied) = id(night_now) ? 1 : 0;"
      - if:
          condition:
            and:
              - switch.is_on: auto_dim
              - light.is_on: backlight
          then:
            - light.turn_on:
                id: backlight
                transition_length: 3s
                brightness: !lambda |-
                  return (id(night_now) ? id(bright_night).state : id(bright_day).state) / 100.0f;

  # Display aus -> Tippen schaltet die Hintergrundbeleuchtung für 20 s ein.
  # Das Licht-Entity in HA bleibt dabei unverändert "aus"; es wird direkt
  # der PWM-Ausgang gesetzt. Schaltet HA in der Zeit ein, bleibt es an.
  - id: wake_tap
    mode: restart
    then:
      - script.execute: dim_compute
      - lambda: |-
          id(woken_by_tap) = true;
          float b = (id(night_now) ? id(bright_night).state : id(bright_day).state) / 100.0f;
          if (!id(backlight).current_values.is_on()) id(backlight_pwm).set_level(b);
      - delay: 20s
      - lambda: |-
          id(woken_by_tap) = false;
          if (!id(backlight).current_values.is_on()) id(backlight_pwm).set_level(0.0f);

