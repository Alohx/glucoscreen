# =====================================================================
#  Glucoscreen – Glukose-Anzeige (CGM) für Home Assistant
#  Hardware: Guition ESP32-S3-4848S040 (480x480, ST7701S, GT911)
#
#  Seite 1 (Start):    Glukosewert im Kreis + Trendpfeil
#                      (Gestaltung inspiriert von gängigen CGM-Apps, eigene Umsetzung)
#  Seite 2 (Swipe):    Verlaufsdiagramm 3 / 6 / 12 / 24 h
#                      (Punkt lange drücken = Uhrzeit anzeigen)
#  Seite 3 (Swipe):    Grenzwerte
#  Seite 4 (Swipe):    Anzeige (Helligkeit, Nachtzeit, Hell/Dunkel, Sprache)
#
#  Alle Einstellungen sind zusätzlich als Entitäten in Home Assistant
#  verfügbar.
#
#  Sensor-unabhängig: funktioniert mit jedem Glukosesensor (CGM), dessen
#  Wert, Trend und Messzeitpunkt in Home Assistant verfügbar sind
#  (getestet mit Dexcom G7 über die Dexcom-Integration).
#
#  Die Glukosedaten werden NICHT direkt aus HA-Entitäten gelesen,
#  sondern von einer HA-Automation über die Aktion
#  "esphome.<name>_glukose_setzen" an das Display gesendet.
#  Nach einer Datenlücke fordert das Display über das Ereignis
#  "esphome.<name>_verlauf_anfordern" den Verlauf aus HA nach.
#
#  Benötigt die Datei glucoscreen_ui.h (Übersetzungen + Farben) im
#  selben Ordner.
# =====================================================================

substitutions:
  name: glucoscreen
  friendly_name: Glucoscreen

esphome:
  name: ${name}
  friendly_name: ${friendly_name}
  includes:
    - glucoscreen_ui.h
  platformio_options:
    board_build.flash_mode: dio
  on_boot:
    priority: -100
    then:
      - lambda: |-
          // Drehpunkte für Trend-Spitze und Pfeile (Kreismittelpunkt)
          lv_obj_set_style_transform_pivot_x(id(trend_tip), 0, 0);
          lv_obj_set_style_transform_pivot_y(id(trend_tip), 0, 0);
          lv_obj_set_style_transform_pivot_x(id(trend_arrows), 0, 0);
          lv_obj_set_style_transform_pivot_y(id(trend_arrows), 40, 0);
          id(ui_ready) = true;
      - script.execute: dim_compute
      - lambda: |-
          id(dark_active) = id(theme_mode) == 1 || (id(theme_mode) == 2 && id(night_now));
      - script.execute: apply_theme
      - script.execute: apply_language
      - script.execute: refresh_all

esp32:
  board: esp32-s3-devkitc-1
  variant: esp32s3
  flash_size: 16MB
  framework:
    type: esp-idf
    sdkconfig_options:
      CONFIG_ESP32S3_DEFAULT_CPU_FREQ_240: y
      CONFIG_ESP32S3_DATA_CACHE_64KB: y
      CONFIG_SPIRAM_FETCH_INSTRUCTIONS: y
      CONFIG_SPIRAM_RODATA: y

psram:
  mode: octal
  speed: 80MHz

logger:
  level: INFO

api:
  encryption:
    key: !secret glucoscreen_api_key
  actions:
    # Aktuelle Messung aus HA übernehmen
    #   wert:          Glukosewert in mg/dL (0 = keine Daten; mmol/L x 18 umrechnen)
    #   trendrichtung: z. B. rising_quickly | rising | rising_slightly | steady |
    #                  falling_slightly | falling | falling_quickly
    #                  oder Nightscout-Format DoubleUp | SingleUp | FortyFiveUp |
    #                  Flat | FortyFiveDown | SingleDown | DoubleDown
    #                  (leer/unbekannt = kein Pfeil)
    #   zeitpunkt:     Unix-Zeitstempel der Messung (0 = jetzt)
    - action: glukose_setzen
      variables:
        wert: float
        trendrichtung: string
        zeitpunkt: int
      then:
        - lambda: |-
            uint32_t prev = id(last_reading_ts);
            uint32_t ts = zeitpunkt > 0 ? (uint32_t) zeitpunkt : 0;
            if (ts == 0) {
              auto now = id(ha_time).now();
              if (now.is_valid()) ts = now.timestamp;
            }
            // Lücke? (Neustart oder > 11 min keine Messung) -> Verlauf nachfordern
            bool gap = (prev == 0) || (ts > prev + 11 * 60);
            if (gap && wert > 0 &&
                (id(last_backfill_req) == 0 || millis() - id(last_backfill_req) > 120000))
              id(need_backfill) = true;
            id(last_reading_ts) = ts;
            id(trend).publish_state(trendrichtung);
            id(glucose).publish_state(wert > 0 ? wert : NAN);
        - script.execute: record_reading
        - script.execute: refresh_all
        - if:
            condition:
              lambda: "return id(need_backfill);"
            then:
              - lambda: |-
                  id(need_backfill) = false;
                  id(last_backfill_req) = millis();
              - logger.log: "Datenlücke erkannt – fordere Verlauf aus Home Assistant an"
              - homeassistant.event:
                  event: esphome.${name}_verlauf_anfordern

    # Verlauf aus HA nachladen. Format: "zeit:wert,zeit:wert,..."
    #   zeit = Unix-Zeitstempel (oder alt: Slot = Unix-Zeit / 300)
    - action: verlauf_laden
      variables:
        daten: string
      then:
        - lambda: |-
            // Einträge: Unix-Zeit (Sekunden) + Wert
            std::vector<std::pair<uint32_t, uint16_t>> pts;
            const char *p = daten.c_str();
            while (*p) {
              char *end;
              unsigned long tv = strtoul(p, &end, 10);
              if (end == p || *end != ':') break;
              p = end + 1;
              long v = strtol(p, &end, 10);
              if (end == p) break;
              if (tv > 0 && tv < 100000000UL) tv *= 300;   // altes Slot-Format
              if (tv > 0 && v >= 20 && v <= 500) pts.push_back({(uint32_t) tv, (uint16_t) v});
              p = end;
              while (*p == ',' || *p == ' ') p++;
            }
            if (pts.empty()) return;
            std::sort(pts.begin(), pts.end());
            auto &vals = id(hist_vals);
            // Puffer ggf. bis zum neuesten Slot vorschieben
            uint32_t newest = pts.back().first / 300;
            uint32_t last = id(hist_last_slot);
            if (last == 0 || newest > last) {
              if (last != 0 && newest - last < 288) {
                for (uint32_t s = last + 1; s < newest; s++) vals[s % 288] = 0;
              } else if (last != 0) {
                vals.fill(0);
              }
              id(hist_last_slot) = newest;
              last = newest;
            }
            // HA speichert nur Wertänderungen -> gleichbleibende Werte max. 30 min
            // fortschreiben. Vorhandene Werte werden nie überschrieben, nur Lücken gefüllt.
            int filled = 0;
            for (size_t i = 0; i < pts.size(); i++) {
              uint32_t s = pts[i].first / 300;
              uint16_t enc = (uint16_t) ((((pts[i].first % 300) / 20) << 12) | pts[i].second);
              uint32_t nxt = (i + 1 < pts.size()) ? pts[i + 1].first / 300 : s + 1;
              uint32_t upto = std::min(std::max(nxt, s + 1), s + 7);
              if (i + 1 == pts.size()) upto = s + 1;
              for (uint32_t k = s; k < upto; k++) {
                if (k > last || last - k >= 288) continue;
                if (vals[k % 288] == 0) { vals[k % 288] = enc; filled++; }
              }
            }
            ESP_LOGI("glucose", "Verlauf geladen: %u Einträge, %d Lücken gefüllt",
                     (unsigned) pts.size(), filled);
        - script.execute: chart_redraw

    - action: verlauf_loeschen
      then:
        - lambda: |-
            id(hist_vals).fill(0);
            id(hist_last_slot) = 0;
        - script.execute: chart_redraw

ota:
  - platform: esphome
    password: !secret ota_password

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    ssid: "Glucoscreen Fallback"
    password: !secret ap_password

captive_portal:

preferences:
  flash_write_interval: 5min      # schont den Flash (Verlauf wird gespeichert)

# ---------------------------------------------------------------------
#  Globale Variablen
# ---------------------------------------------------------------------
globals:
  - id: ui_ready
    type: bool
    initial_value: "false"
  # 24 h Verlauf im 5-Minuten-Raster, übersteht Neustarts.
  # Bits 0-11: Wert in mg/dL, Bits 12-15: Sekunden im Slot / 20
  - id: hist_vals
    type: std::array<uint16_t, 288>
    restore_value: true
    initial_value: "std::array<uint16_t, 288>{}"
  - id: hist_last_slot
    type: uint32_t
    restore_value: true
    initial_value: "0"
  - id: last_reading_ts
    type: uint32_t
    initial_value: "0"
  - id: need_backfill
    type: bool
    initial_value: "false"
  - id: last_backfill_req
    type: uint32_t
    initial_value: "0"
  - id: chart_hours
    type: int
    initial_value: "3"
  - id: tz_off              # Abstand Ortszeit - UTC in Sekunden
    type: int
    initial_value: "0"
  - id: night_now
    type: bool
    initial_value: "false"
  - id: night_applied
    type: int
    initial_value: "-1"
  - id: woken_by_tap
    type: bool
    initial_value: "false"
  # Darstellung / Sprache
  - id: theme_mode          # 0 = hell, 1 = dunkel, 2 = automatisch (Nacht)
    type: int
    initial_value: "0"
  - id: dark_active
    type: bool
    initial_value: "false"
  - id: lang_idx
    type: int
    initial_value: "0"
  # Wischgesten / Diagramm-Uhrzeit
  - id: cur_tile
    type: int
    initial_value: "0"
  - id: swipe_x0
    type: int
    initial_value: "0"
  - id: swipe_y0
    type: int
    initial_value: "0"
  - id: swipe_x1
    type: int
    initial_value: "0"
  - id: swipe_y1
    type: int
    initial_value: "0"
  - id: swipe_t0
    type: uint32_t
    initial_value: "0"
  - id: swipe_ok
    type: bool
    initial_value: "false"
  - id: scrub_active
    type: bool
    initial_value: "false"

# ---------------------------------------------------------------------
#  Hardware
# ---------------------------------------------------------------------
spi:
  clk_pin: GPIO48
  mosi_pin: GPIO47

i2c:
  sda: GPIO19
  scl: GPIO45
  frequency: 400kHz

display:
  - platform: st7701s
    id: main_display
    update_interval: never
    auto_clear_enabled: false
    spi_mode: MODE3
    data_rate: 2MHz
    color_order: RGB
    invert_colors: false
    dimensions:
      width: 480
      height: 480
    cs_pin: GPIO39
    de_pin: GPIO18
    hsync_pin: GPIO16
    vsync_pin: GPIO17
    pclk_pin: GPIO21
    pclk_frequency: 12MHz
    pclk_inverted: false
    hsync_pulse_width: 8
    hsync_front_porch: 10
    hsync_back_porch: 20
    vsync_pulse_width: 8
    vsync_front_porch: 10
    vsync_back_porch: 10
    init_sequence:
      - 1
      - [0xFF, 0x77, 0x01, 0x00, 0x00, 0x10]
      - [0xCD, 0x00]
    data_pins:
      red: [GPIO11, GPIO12, GPIO13, GPIO14, GPIO0]
      green: [GPIO8, GPIO20, GPIO3, GPIO46, GPIO9, GPIO10]
      blue: [GPIO4, GPIO5, GPIO6, GPIO7, GPIO15]

touchscreen:
  - platform: gt911
    id: main_touch
    display: main_display
    update_interval: 16ms        # schnelleres Abtasten (Standard 50 ms)
    # Rohwerte des GT911 1:1 auf 480x480 abbilden. Ohne diese Angabe
    # wurden Berührungen zu weit links/oben erkannt.
    calibration:
      x_min: 0
      x_max: 480
      y_min: 0
      y_max: 480
    on_touch:
      # Startpunkt für Wischgeste merken
      - lambda: |-
          id(swipe_x0) = id(swipe_x1) = touch.x;
          id(swipe_y0) = id(swipe_y1) = touch.y;
          id(swipe_t0) = millis();
          id(scrub_active) = false;
          // Wischen nur, wenn das Display schon leuchtet (nicht beim Aufwecken)
          id(swipe_ok) = id(backlight).current_values.is_on() || id(woken_by_tap);
      - if:
          condition:
            and:
              - switch.is_on: tap_wake
              - or:
                  - light.is_off: backlight
                  - lambda: "return id(woken_by_tap);"
          then:
            - script.execute: wake_tap
    on_update:
      - lambda: |-
          if (!touches.empty()) {
            id(swipe_x1) = touches[0].x;
            id(swipe_y1) = touches[0].y;
          }
          // Diagramm: Finger ca. 0,45 s ruhig halten -> Uhrzeit des Punktes zeigen,
          // danach folgt die Anzeige dem Finger
          if (!id(swipe_ok) || id(cur_tile) != 1) return;
          const int AX0 = 22, AY0 = 82, AW = 390, AH = 320;   // Diagrammfläche absolut
          int fx = id(swipe_x1), fy = id(swipe_y1);
          if (!id(scrub_active)) {
            int sx = id(swipe_x0), sy = id(swipe_y0);
            if (sx < AX0 || sx >= AX0 + AW || sy < AY0 || sy >= AY0 + AH) return;
            if (abs(fx - sx) > 20 || abs(fy - sy) > 20) return;
            if (millis() - id(swipe_t0) < 450) return;
            id(scrub_active) = true;
          }
          id(chart_scrub)->execute(fx - AX0);
    on_release:
      - lambda: |-
          if (id(scrub_active)) {
            id(scrub_active) = false;
            id(chart_scrub_end)->execute();
            return;
          }
          // Kurzer Wisch (ab 50 px, überwiegend waagerecht) blättert eine Seite weiter
          if (!id(swipe_ok)) return;
          int dx = id(swipe_x1) - id(swipe_x0);
          int dy = id(swipe_y1) - id(swipe_y0);
          uint32_t dt = millis() - id(swipe_t0);
          if (abs(dx) < 50 || abs(dx) < abs(dy) * 3 / 2 || dt > 1500) return;
          id(goto_tile)->execute(id(cur_tile) + (dx < 0 ? 1 : -1));

output:
  - platform: ledc
    id: backlight_pwm
    pin: GPIO38
    # Über dem Hörbereich: bei 1 kHz pfeift die Spule des Backlight-Treibers
    # hörbar mit, sobald gedimmt wird. Pfeift es noch, 30000Hz oder 40000Hz probieren.
    frequency: 25000Hz
    min_power: 0.02
    zero_means_zero: true

light:
  - platform: monochromatic
    id: backlight
    name: "Backlight"
    output: backlight_pwm
    restore_mode: RESTORE_DEFAULT_ON
    default_transition_length: 1s
    on_turn_on:
      - script.execute: dim_apply

# Relais der 4848S040-Variante (optional – entfernen, falls nicht vorhanden)
switch:
  - platform: gpio
    pin: GPIO40
    name: "Relay 1"
    id: relay_1
  - platform: gpio
    pin: GPIO2
    name: "Relay 2"
    id: relay_2
  - platform: gpio
    pin: GPIO1
    name: "Relay 3"
    id: relay_3

  - platform: template
    id: auto_dim
    name: "Automatisch dimmen"
    icon: mdi:brightness-auto
    optimistic: true
    restore_mode: RESTORE_DEFAULT_ON
    entity_category: config
    on_turn_on:
      - script.execute: dim_apply
      - script.execute: update_settings
    on_turn_off:
      - script.execute: update_settings

  - platform: template
    id: tap_wake
    name: "Tippen weckt Display"
    icon: mdi:gesture-tap
    optimistic: true
    restore_mode: RESTORE_DEFAULT_ON
    entity_category: config

select:
  - platform: template
    id: sel_theme
    name: "Darstellung"
    icon: mdi:theme-light-dark
    options:
      - "Hell"
      - "Dunkel"
      - "Automatisch (Nacht)"
    initial_option: "Hell"
    optimistic: true
    restore_value: true
    entity_category: config
    on_value:
      - lambda: "id(theme_mode) = (int) i;"
      - script.execute: theme_check
      - script.execute: update_settings

  # Reihenfolge = Spalten in glucoscreen_ui.h (LANG_NAMES)
  - platform: template
    id: sel_language
    name: "Sprache"
    icon: mdi:translate
    options:
      - "Deutsch"
      - "English"
    initial_option: "Deutsch"
    optimistic: true
    restore_value: true
    entity_category: config
    on_value:
      - lambda: "id(lang_idx) = (int) i;"
      - script.execute: apply_language
      - script.execute: update_settings

time:
  - platform: homeassistant
    id: ha_time
    on_time_sync:
      - script.execute: refresh_all
      - script.execute: dim_apply
      - script.execute: theme_check

# ---------------------------------------------------------------------
#  Glukosedaten (werden per Aktion "glukose_setzen" aus HA befüllt)
# ---------------------------------------------------------------------
sensor:
  - platform: template
    id: glucose
    internal: true
    unit_of_measurement: mg/dL
    update_interval: never

text_sensor:
  - platform: template
    id: trend
    internal: true
    update_interval: never

# ---------------------------------------------------------------------
#  Einstellungen (in HA und am Gerät änderbar)
# ---------------------------------------------------------------------
number:
  - platform: template
    id: thr_urgent_low
    name: "Grenze dringend niedrig"
    icon: mdi:alert-octagon
    unit_of_measurement: mg/dL
    min_value: 40
    max_value: 100
    step: 5
    initial_value: 55
    optimistic: true
    restore_value: true
    mode: box
    entity_category: config
    on_value:
      - script.execute: refresh_all
  - platform: template
    id: thr_low
    name: "Grenze niedrig"
    icon: mdi:arrow-down-bold
    unit_of_measurement: mg/dL
    min_value: 50
    max_value: 150
    step: 5
    initial_value: 70
    optimistic: true
    restore_value: true
    mode: box
    entity_category: config
    on_value:
      - script.execute: refresh_all
  - platform: template
    id: thr_high
    name: "Grenze hoch"
    icon: mdi:arrow-up-bold
    unit_of_measurement: mg/dL
    min_value: 120
    max_value: 400
    step: 5
    initial_value: 250
    optimistic: true
    restore_value: true
    mode: box
    entity_category: config
    on_value:
      - script.execute: refresh_all
  - platform: template
    id: thr_target_low
    name: "Zielbereich unten"
    icon: mdi:target
    unit_of_measurement: mg/dL
    min_value: 50
    max_value: 200
    step: 5
    initial_value: 70
    optimistic: true
    restore_value: true
    mode: box
    entity_category: config
    on_value:
      - script.execute: refresh_all
  - platform: template
    id: thr_target_high
    name: "Zielbereich oben"
    icon: mdi:target
    unit_of_measurement: mg/dL
    min_value: 100
    max_value: 400
    step: 5
    initial_value: 180
    optimistic: true
    restore_value: true
    mode: box
    entity_category: config
    on_value:
      - script.execute: refresh_all

  - platform: template
    id: bright_day
    name: "Helligkeit Tag"
    icon: mdi:white-balance-sunny
    unit_of_measurement: "%"
    min_value: 5
    max_value: 100
    step: 5
    initial_value: 80
    optimistic: true
    restore_value: true
    mode: slider
    entity_category: config
    on_value:
      - script.execute: dim_apply
      - script.execute: update_settings
  - platform: template
    id: bright_night
    name: "Helligkeit Nacht"
    icon: mdi:weather-night
    unit_of_measurement: "%"
    min_value: 2
    max_value: 100
    step: 1
    initial_value: 10
    optimistic: true
    restore_value: true
    mode: slider
    entity_category: config
    on_value:
      - script.execute: dim_apply
      - script.execute: update_settings

datetime:
  - platform: template
    id: night_start
    type: time
    name: "Nacht ab"
    icon: mdi:weather-night
    optimistic: true
    restore_value: true
    initial_value: "22:00:00"
    entity_category: config
    on_value:
      - script.execute: dim_apply
      - script.execute: theme_check
      - script.execute: update_settings
  - platform: template
    id: night_end
    type: time
    name: "Nacht bis"
    icon: mdi:weather-sunset-up
    optimistic: true
    restore_value: true
    initial_value: "06:30:00"
    entity_category: config
    on_value:
      - script.execute: dim_apply
      - script.execute: theme_check
      - script.execute: update_settings

interval:
  - interval: 30s
    then:
      - script.execute: update_main
      - script.execute: dim_check
  - interval: 60s
    then:
      - script.execute: chart_redraw

# ---------------------------------------------------------------------
#  Skripte
# ---------------------------------------------------------------------
script:
  # Aktuellen Messwert in den 24h-Puffer schreiben
  - id: record_reading
    then:
      - lambda: |-
          uint32_t ts = id(last_reading_ts);
          float g = id(glucose).state;
          if (ts == 0 || isnan(g) || g <= 0) return;
          uint32_t slot = ts / 300;
          auto &vals = id(hist_vals);
          uint32_t last = id(hist_last_slot);
          if (last == 0 || slot > last) {
            if (last != 0 && slot - last < 288) {
              for (uint32_t s = last + 1; s < slot; s++) vals[s % 288] = 0;
            } else if (last != 0) {
              vals.fill(0);
            }
            id(hist_last_slot) = slot;
          } else if (last - slot >= 288) {
            return;
          }
          int v = std::min(4095, (int) lroundf(g));
          vals[slot % 288] = (uint16_t) ((((ts % 300) / 20) << 12) | v);

  - id: refresh_all
    then:
      - script.execute: update_main
      - script.execute: update_settings
      - script.execute: chart_redraw

  # ---------- Startbildschirm ----------
  - id: update_main
    then:
      - lambda: |-
          if (!id(ui_ready)) return;
          const ui::Palette &P = ui::pal(id(dark_active));
          int L = id(lang_idx);
          auto now = id(ha_time).now();
          if (now.is_valid())
            lv_label_set_text_fmt(id(lbl_clock), "%02d:%02d", now.hour, now.minute);

          float g = id(glucose).state;
          const std::string &trd = id(trend).state;
          uint32_t ts = id(last_reading_ts);
          int age_min = -1;
          if (now.is_valid() && ts > 0 && (uint32_t) now.timestamp >= ts)
            age_min = ((uint32_t) now.timestamp - ts) / 60;
          bool nodata = isnan(g) || g <= 0;
          bool stale = nodata || age_min > 15;

          char buf[24];
          if (nodata) strcpy(buf, "---");
          else if (g < 40) strcpy(buf, "LO");
          else if (g > 400) strcpy(buf, "HI");
          else snprintf(buf, sizeof(buf), "%d", (int) lroundf(g));
          lv_label_set_text(id(lbl_value), buf);

          // Farbschema angelehnt an gängige CGM-Apps: Ring + Spitze in Grundfarbe,
          // nur die Innenfläche wird gelb (hoch) bzw. rot (niedrig)
          uint32_t face = P.face, txt = P.text, unit = P.text2;
          if (stale) {
            txt = P.stale;
          } else if (g < id(thr_urgent_low).state) {
            face = ui::COL_URGENT_LOW; txt = unit = 0xFFFFFF;
          } else if (g < id(thr_low).state) {
            face = ui::COL_LOW; txt = unit = 0xFFFFFF;
          } else if (g > id(thr_high).state) {
            face = ui::COL_HIGH; txt = unit = 0x111111;
          }
          lv_obj_set_style_bg_color(id(glucose_circle), lv_color_hex(face), 0);
          lv_obj_set_style_text_color(id(lbl_value), lv_color_hex(txt), 0);
          lv_obj_set_style_text_color(id(lbl_unit), lv_color_hex(unit), 0);
          lv_obj_set_style_text_color(id(arrow_1), lv_color_hex(P.text), 0);
          lv_obj_set_style_text_color(id(arrow_2), lv_color_hex(P.text), 0);

          // Trend -> Richtung (Bildschirmwinkel: 0 = rechts, -90 = oben).
          // Akzeptiert verschiedene Schreibweisen, damit nicht nur die
          // Dexcom-Integration funktioniert (Groß/Klein, _ - und Leerzeichen egal):
          //   Dexcom (HA):  rising_quickly, rising, rising_slightly, steady, ...
          //   Nightscout:   DoubleUp, SingleUp, FortyFiveUp, Flat, FortyFiveDown, ...
          //   sonstige:     rapidly_rising, slowly_falling, stable, up, down, ...
          std::string tk;
          for (char c : trd)
            if (c != '_' && c != '-' && c != ' ') tk += (char) tolower((unsigned char) c);
          auto is = [&](std::initializer_list<const char *> l) {
            for (const char *s : l) if (tk == s) return true;
            return false;
          };
          int ang = 0, n = 1;
          bool has = true;
          if (is({"risingquickly", "doubleup", "rapidlyrising", "risingfast", "uprapid"})) { ang = -90; n = 2; }
          else if (is({"rising", "singleup", "up"})) ang = -90;
          else if (is({"risingslightly", "fortyfiveup", "slowlyrising", "risingslowly"})) ang = -45;
          else if (is({"steady", "flat", "stable", "constant", "level"})) ang = 0;
          else if (is({"fallingslightly", "fortyfivedown", "slowlyfalling", "fallingslowly"})) ang = 45;
          else if (is({"falling", "singledown", "down"})) ang = 90;
          else if (is({"fallingquickly", "doubledown", "rapidlyfalling", "fallingfast", "downrapid"})) { ang = 90; n = 2; }
          else has = false;
          if (stale) has = false;

          auto set_rot = [](lv_obj_t *o, int deg) {
            int a = ((deg % 360) + 360) % 360;
          #if LVGL_VERSION_MAJOR >= 9
            lv_obj_set_style_transform_rotation(o, a * 10, 0);
          #else
            lv_obj_set_style_transform_angle(o, a * 10, 0);
          #endif
          };
          if (has) {
            // Quadrat mit Ecke im Kreismittelpunkt -> Diagonale zeigt in Trendrichtung
            set_rot(id(trend_tip), ang - 45);
            set_rot(id(trend_arrows), ang);
            lv_obj_clear_flag(id(trend_tip), LV_OBJ_FLAG_HIDDEN);
            lv_obj_clear_flag(id(trend_arrows), LV_OBJ_FLAG_HIDDEN);
            if (n == 2) lv_obj_clear_flag(id(arrow_2), LV_OBJ_FLAG_HIDDEN);
            else lv_obj_add_flag(id(arrow_2), LV_OBJ_FLAG_HIDDEN);
          } else {
            lv_obj_add_flag(id(trend_tip), LV_OBJ_FLAG_HIDDEN);
            lv_obj_add_flag(id(trend_arrows), LV_OBJ_FLAG_HIDDEN);
          }

          // Alter der Messung
          if (age_min < 0) lv_label_set_text(id(lbl_age), "");
          else if (age_min < 1) lv_label_set_text(id(lbl_age), ui::tr(ui::T_AGE_NOW, L));
          else {
            snprintf(buf, sizeof(buf), ui::tr(ui::T_AGE_MIN, L), age_min);
            lv_label_set_text(id(lbl_age), buf);
          }
          lv_obj_set_style_text_color(id(lbl_age),
              lv_color_hex(age_min > 15 ? 0xE0262F : P.text2), 0);

