# =====================================================================
#  Glucoscreen – Glukose-Anzeige (CGM) für Home Assistant
#  Hardware-Paket für den Guition ESP32-S3-4848S040
#  (480x480, ST7701S, GT911)
#
#  Diese Datei enthält nur die Gerätehardware. Oberfläche und Logik
#  stehen in glucoscreen_core.yaml (wird unten eingebunden) und werden
#  auch vom Simulator (simulator/simulator.yaml) verwendet.
#
#  EINBINDUNG: Diese Datei ist ein ESPHome-Paket und wird NICHT kopiert,
#  sondern aus der eigenen Gerätedatei von GitHub geladen (siehe
#  example.yaml). WLAN, API-Schlüssel und OTA-Passwort stehen nur in der
#  eigenen Gerätedatei – dieses Paket enthält keine Zugangsdaten.
# =====================================================================

substitutions:
  name: glucoscreen
  friendly_name: Glucoscreen
  # Quelle der Komponente glucoscreen_ui. Für einen Fork oder ein privates
  # Repository (URL mit Zugriffstoken, per !secret) in der Gerätedatei setzen.
  glucoscreen_repo_url: https://github.com/Alohx/glucoscreen
  glucoscreen_ref: main
  glucoscreen_refresh: 1d

# Übersetzungen + Farbpaletten (components/glucoscreen_ui/glucoscreen_ui.h)
external_components:
  - source:
      type: git
      url: ${glucoscreen_repo_url}
      ref: ${glucoscreen_ref}
    components: [glucoscreen_ui]
    refresh: ${glucoscreen_refresh}

# Oberfläche und Logik (gemeinsam mit dem Simulator)
packages:
  core: !include glucoscreen_core.yaml

esphome:
  name: ${name}
  friendly_name: ${friendly_name}
  platformio_options:
    board_build.flash_mode: dio

esp32:
  board: esp32-s3-devkitc-1
  variant: esp32s3
  flash_size: 16MB
  framework:
    type: esp-idf
    sdkconfig_options:
      CONFIG_ESP32S3_DEFAULT_CPU_FREQ_240: y
      CONFIG_ESP32S3_DATA_CACHE_64KB: y
      CONFIG_SPIRAM_FETCH_INSTRUCTIONS: y
      CONFIG_SPIRAM_RODATA: y

psram:
  mode: octal
  speed: 80MHz

# ota, wifi und captive_portal stehen in der eigenen Gerätedatei (example.yaml)

preferences:
  flash_write_interval: 5min      # schont den Flash (Verlauf wird gespeichert)

# ---------------------------------------------------------------------
#  Hardware
# ---------------------------------------------------------------------
spi:
  clk_pin: GPIO48
  mosi_pin: GPIO47

i2c:
  sda: GPIO19
  scl: GPIO45
  frequency: 400kHz

display:
  - platform: st7701s
    id: main_display
    update_interval: never
    auto_clear_enabled: false
    spi_mode: MODE3
    data_rate: 2MHz
    color_order: RGB
    invert_colors: false
    dimensions:
      width: 480
      height: 480
    cs_pin: GPIO39
    de_pin: GPIO18
    hsync_pin: GPIO16
    vsync_pin: GPIO17
    pclk_pin: GPIO21
    pclk_frequency: 12MHz
    pclk_inverted: false
    hsync_pulse_width: 8
    hsync_front_porch: 10
    hsync_back_porch: 20
    vsync_pulse_width: 8
    vsync_front_porch: 10
    vsync_back_porch: 10
    init_sequence:
      - 1
      - [0xFF, 0x77, 0x01, 0x00, 0x00, 0x10]
      - [0xCD, 0x00]
    data_pins:
      red: [GPIO11, GPIO12, GPIO13, GPIO14, GPIO0]
      green: [GPIO8, GPIO20, GPIO3, GPIO46, GPIO9, GPIO10]
      blue: [GPIO4, GPIO5, GPIO6, GPIO7, GPIO15]

touchscreen:
  - platform: gt911
    id: main_touch
    display: main_display
    update_interval: 16ms        # schnelleres Abtasten (Standard 50 ms)
    # Rohwerte des GT911 1:1 auf 480x480 abbilden. Ohne diese Angabe
    # wurden Berührungen zu weit links/oben erkannt.
    calibration:
      x_min: 0
      x_max: 480
      y_min: 0
      y_max: 480
    # Gesten-Auswertung (on_touch / on_update / on_release): glucoscreen_core.yaml

output:
  - platform: ledc
    id: backlight_pwm
    pin: GPIO38
    # Über dem Hörbereich: bei 1 kHz pfeift die Spule des Backlight-Treibers
    # hörbar mit, sobald gedimmt wird. Pfeift es noch, 30000Hz oder 40000Hz probieren.
    frequency: 25000Hz
    min_power: 0.02
    zero_means_zero: true

# Relais der 4848S040-Variante (optional – entfernen, falls nicht vorhanden)
switch:
  - platform: gpio
    pin: GPIO40
    name: "Relay 1"
    id: relay_1
  - platform: gpio
    pin: GPIO2
    name: "Relay 2"
    id: relay_2
  - platform: gpio
    pin: GPIO1
    name: "Relay 3"
    id: relay_3

time:
  - platform: homeassistant
    id: ha_time
    # on_time_sync: glucoscreen_core.yaml
