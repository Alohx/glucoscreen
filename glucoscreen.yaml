  # Nachtzeit am Gerät verstellen (Schritte von 15 min)
  - id: adjust_night
    parameters:
      which: int     # 0 = Nacht ab, 1 = Nacht bis
      delta: int     # Minuten
    then:
      - lambda: |-
          auto *e = which == 0 ? id(night_start) : id(night_end);
          int m = e->hour * 60 + e->minute;
          m = (((m + delta) / 15) * 15 % 1440 + 1440) % 1440;
          auto call = e->make_call();
          call.set_time(m / 60, m % 60, 0);
          call.perform();

